---
# KServe InferenceService for House Price Model — LOCAL/KIND TESTING
# Model artifacts are baked into the Docker image (models/trained/*.pkl via Dockerfile COPY).
# No S3, no initContainer, no credentials needed. Good for local kind development.
#
# For EKS/production, use inference-service-eks.yaml instead (pulls model from S3 at
# pod startup so you don't need to rebuild the image to update the model).

apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: house-price-predictor
  namespace: mlops-prod
  labels:
    app: house-price-predictor
    version: v1
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    containers:
      - name: kserve-container
        image: rakarun/mlops:house-price-model-latest
        ports:
          - containerPort: 8000
            protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

---
# Service to expose the InferenceService
apiVersion: v1
kind: Service
metadata:
  name: house-price-predictor
  namespace: mlops-prod
  labels:
    app: house-price-predictor
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    serving.kserve.io/inferenceservice: house-price-predictor
