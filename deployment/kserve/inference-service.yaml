---
# KServe InferenceService for House Price Model (v0.11.0, RawDeployment mode)
# Uses "custom container" predictor since the image is a plain FastAPI app
# (not KServe's sklearn-server protocol contract)

apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: house-price-predictor
  namespace: mlops-prod
  labels:
    app: house-price-predictor
    version: v1
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    containers:
      - name: kserve-container
        image: rakarun/mlops:house-price-model-latest
        ports:
          - containerPort: 8000
            protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

---
# Service to expose the InferenceService
apiVersion: v1
kind: Service
metadata:
  name: house-price-predictor
  namespace: mlops-prod
  labels:
    app: house-price-predictor
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    serving.kserve.io/inferenceservice: house-price-predictor
